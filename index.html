<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ALIA - El asistente que optimiza tus reservas</title>
    <meta name="description" content="Automatiza tus reservas, reduce los no-shows y ofrece una atención premium 24/7 sin levantar un dedo. El asistente digital que tu negocio merece.">

    <link rel="shortcut icon" href="Images/Logos/LogoHexagonoAlia-SinFondo.png" type="image/x-icon">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Custom CSS (Modulos) -->
    <link rel="stylesheet" href="CSS/LandingPage/global.css">
    <link rel="stylesheet" href="CSS/LandingPage/header.css">
    <link rel="stylesheet" href="CSS/LandingPage/hero.css">
    <link rel="stylesheet" href="CSS/LandingPage/phone-mockup.css">
    <link rel="stylesheet" href="CSS/LandingPage/chat.css">
    <link rel="stylesheet" href="CSS/LandingPage/comparison.css">
    <link rel="stylesheet" href="CSS/LandingPage/technology.css">
    <link rel="stylesheet" href="CSS/LandingPage/features.css">
    <link rel="stylesheet" href="CSS/LandingPage/portal.css">
    <link rel="stylesheet" href="CSS/LandingPage/hardware.css">
    <link rel="stylesheet" href="CSS/LandingPage/hybrid.css">
    <link rel="stylesheet" href="CSS/LandingPage/calculator.css">
    <link rel="stylesheet" href="CSS/LandingPage/roadmap.css">
    <link rel="stylesheet" href="CSS/LandingPage/cta.css">
    <link rel="stylesheet" href="CSS/LandingPage/footer.css">
    <link rel="stylesheet" href="CSS/LandingPage/ai-chat-button.css">
    <link rel="stylesheet" href="CSS/LandingPage/ai-chat-window.css">

    <!-- Responsive CSS (Modulos) -->
    <link rel="stylesheet" href="CSS/Responsive/LandingPage/header-responsive.css">
    <link rel="stylesheet" href="CSS/Responsive/LandingPage/hero-responsive.css">
    <link rel="stylesheet" href="CSS/Responsive/LandingPage/phone-mockup-responsive.css">
    <link rel="stylesheet" href="CSS/Responsive/LandingPage/comparison-responsive.css">
    <link rel="stylesheet" href="CSS/Responsive/LandingPage/technology-responsive.css">
    <link rel="stylesheet" href="CSS/Responsive/LandingPage/features-responsive.css">
    <link rel="stylesheet" href="CSS/Responsive/LandingPage/portal-responsive.css">
    <link rel="stylesheet" href="CSS/Responsive/LandingPage/hardware-responsive.css">
    <link rel="stylesheet" href="CSS/Responsive/LandingPage/hybrid-responsive.css">
    <link rel="stylesheet" href="CSS/Responsive/LandingPage/calculator-responsive.css">
    <link rel="stylesheet" href="CSS/Responsive/LandingPage/roadmap-responsive.css">
    <link rel="stylesheet" href="CSS/Responsive/LandingPage/cta-responsive.css">
    <link rel="stylesheet" href="CSS/Responsive/LandingPage/footer-responsive.css">
    <link rel="stylesheet" href="CSS/Responsive/LandingPage/ai-chat-window-responsive.css">
</head>

<body>
    <!-- AI Chat Toggle Button -->
    <button id="ai-chat-toggle" class="ai-chat-toggle" aria-label="Abrir chat con IA">
        <div class="ai-chat-toggle-icon">
            <img src="Images/Logos/LogoChatAlia-SinFondo.png" alt="Chat IA">
        </div>
    </button>

    <!-- AI Chat Window -->
    <div id="ai-chat-window" class="ai-chat-window">
        <div class="ai-chat-header">
            <img src="Images/Logos/LogoTextoAlia-SinFondo.png" alt="ALIA Logo">
            <button id="ai-chat-close" class="ai-chat-close" aria-label="Cerrar chat">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#00b4d8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="6 9 12 15 18 9"></polyline>
                </svg>
            </button>
        </div>
        <div class="ai-chat-body">
            <div class="ai-chat-message received">
                <div class="ai-chat-avatar">
                    <img src="Images/Logos/LogoHexagonoAlia-SinFondo.png" alt="ALIA Avatar">
                </div>
                <!-- Mensaje de bienvenida inyectado dinámicamente desde content.json -->
                <div class="ai-chat-bubble"><p></p></div>
            </div>
        </div>
        <div class="ai-chat-footer">
            <button class="ai-chat-icon-btn" aria-label="Adjuntar archivo">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
            </button>
            <button class="ai-chat-icon-btn" aria-label="Emoji">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><path d="M8 14s1.5 2 4 2 4-2 4-2"></path><line x1="9" y1="9" x2="9.01" y2="9"></line><line x1="15" y1="9" x2="15.01" y2="9"></line></svg>
            </button>
            <!-- Placeholder inyectado desde content.json -->
            <input type="text" id="ai-chat-input" class="ai-chat-input">
            <button id="ai-chat-send-btn" class="ai-chat-send-btn" aria-label="Enviar mensaje">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
            </button>
        </div>
    </div>

    <!-- Header -->
    <header class="header">
        <div class="logo-container">
            <img src="Images/Logos/LogoHexagonoAlia-SinFondo.png" alt="ALIA Logo" class="logo-img">
            <img src="Images/Logos/LogoTextoAlia-SinFondo.png" alt="Texto ALIA Logo" class="logo-img">
        </div>
        <a href="HTML/prototipo.html" class="btn btn-primary">PROTOTIPO</a>
    </header>

    <!-- Hero Section -->
    <main class="hero">
        <!-- Text Content -->
        <div class="hero-content">
            <!-- Título inyectado desde content.json -->
            <h1 class="hero-title" id="hero-title"></h1>
            <!-- Descripción inyectada desde content.json -->
            <p class="hero-description" id="hero-description"></p>
            <!-- Botones inyectados desde content.json -->
            <div class="hero-buttons" id="hero-buttons"></div>
        </div>

        <!-- Phone Mockup Content -->
        <div class="hero-visual">
            <div class="phone-container">
                <div class="notch"></div>
                <div class="phone-screen">
                    <!-- Chat Header -->
                    <div class="chat-header">
                        <div class="chat-header-left">
                            <span class="icon-back">❮</span>
                            <div class="chat-avatar">
                                <img src="Images/Logos/LogoPeluqueríaNegro.png" alt="Avatar">
                            </div>
                            <div class="chat-info">
                                <!-- Nombre e estado del negocio inyectados desde content.json -->
                                <h3 class="chat-name" id="chat-business-name"></h3>
                                <p class="chat-status" id="chat-business-status"></p>
                            </div>
                        </div>
                        <div class="chat-header-right">
                            <span class="icon-video">
                                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                    stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <polygon points="23 7 16 12 23 17 23 7"></polygon>
                                    <rect x="1" y="5" width="15" height="14" rx="2" ry="2"></rect>
                                </svg>
                            </span>
                            <span class="icon-call">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                    stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <path
                                        d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z">
                                    </path>
                                </svg>
                            </span>
                        </div>
                    </div>

                    <!-- Chat Body donde JS inyecta mensajes -->
                    <div class="chat-body" id="chat-container">
                        <!-- Mensajes inyectados dinámicamente desde Data/messages.json -->
                    </div>

                    <!-- Chat Footer -->
                    <div class="chat-footer">
                        <span class="icon-plus">
                            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <line x1="12" y1="5" x2="12" y2="19"></line>
                                <line x1="5" y1="12" x2="19" y2="12"></line>
                            </svg>
                        </span>
                        <!-- Placeholder inyectado desde content.json -->
                        <div class="chat-input-wrapper">
                            <input type="text" disabled>
                        </div>
                        <div class="icon-send">
                            <svg viewBox="0 0 24 24" width="16" height="16" fill="white">
                                <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"></path>
                            </svg>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Comparison Section -->
    <section class="comparison">
        <div class="comparison-header">
            <!-- Encabezados inyectados desde content.json -->
            <h2 id="comparison-heading"></h2>
            <p id="comparison-subheading"></p>
        </div>

        <div class="comparison-grid">
            <!-- Tradicional -->
            <div class="comparison-card traditional">
                <div class="card-header">
                    <div class="icon-wrapper">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#64748B" stroke-width="2"
                            stroke-linecap="round" stroke-linejoin="round">
                            <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
                            <line x1="16" y1="2" x2="16" y2="6"></line>
                            <line x1="8" y1="2" x2="8" y2="6"></line>
                            <line x1="3" y1="10" x2="21" y2="10"></line>
                        </svg>
                    </div>
                    <!-- Título inyectado desde content.json -->
                    <h3 id="traditional-title"></h3>
                </div>
                <!-- Items inyectados desde content.json -->
                <ul class="comparison-list" id="traditional-list"></ul>
            </div>

            <!-- ALIA -->
            <div class="comparison-card alia">
                <div class="card-header">
                    <div class="icon-wrapper alia-icon">
                        <img src="Images/Logos/LogoHexagonoAlia-SinFondo.png" alt="ALIA">
                    </div>
                    <!-- Título inyectado desde content.json -->
                    <h3 id="alia-title"></h3>
                </div>
                <!-- Items inyectados desde content.json -->
                <ul class="comparison-list" id="alia-list"></ul>
            </div>
        </div>
    </section>

    <!-- Technology Section -->
    <section class="technology">
        <div class="tech-header">
            <!-- Título inyectado desde content.json -->
            <h2 id="technology-heading"></h2>
        </div>
        <!-- Tarjetas inyectadas dinámicamente desde content.json -->
        <div class="tech-grid" id="tech-grid"></div>
    </section>

    <!-- Features Section -->
    <section class="features">
        <div class="features-header">
            <!-- Título inyectado desde content.json -->
            <h2 id="features-heading"></h2>
        </div>
        <!-- Tarjetas inyectadas dinámicamente desde content.json -->
        <div class="features-grid" id="features-grid"></div>
    </section>

    <!-- Portal Section -->
    <section class="portal">
        <div class="portal-container">
            <div class="portal-content">
                <!-- Heading e descripción inyectados desde content.json -->
                <h2 id="portal-heading"></h2>
                <p class="portal-desc" id="portal-description"></p>
                <!-- Features inyectadas desde content.json -->
                <ul class="portal-features" id="portal-features-list"></ul>
            </div>

            <div class="portal-visual">
                <div class="image-wrapper">
                    <img src="Images/PortalDesktopImage.png" alt="Portal ALIA">
                    <!-- Badge inyectado desde content.json -->
                    <div class="floating-badge" id="portal-badge"></div>
                </div>
            </div>
        </div>
    </section>

    <!-- Hybrid Section -->
    <section class="hybrid">
        <div class="hybrid-container">
            <!-- Text Content -->
            <div class="hybrid-content">
                <!-- Tag, heading y descripción inyectados desde content.json -->
                <div class="tag" id="hybrid-tag" style="margin-bottom: 1.5rem; display: inline-block;"></div>
                <h2 id="hybrid-heading"></h2>
                <p class="hybrid-desc" id="hybrid-description"></p>
                <!-- Features inyectadas desde content.json -->
                <ul class="hybrid-features" id="hybrid-features-list"></ul>
            </div>

            <!-- Visual Content -->
            <div class="hybrid-visual">
                <div class="hybrid-image-wrapper">
                    <img src="Images/GestionHibridaImage.png" alt="Gestión híbrida" class="hybrid-image">
                </div>
            </div>
        </div>
    </section>

    <!-- Hardware Section -->
    <section class="hardware">
        <div class="hardware-container">
            <div class="hardware-visual">
                <img src="Images/PortalTabletImage.png" alt="Tablet ALIA en salón">
            </div>

            <div class="hardware-content">
                <!-- Tag, heading, descripción y features inyectados desde content.json -->
                <div class="tag" id="hardware-tag"></div>
                <h2 id="hardware-heading"></h2>
                <p class="hardware-desc" id="hardware-description"></p>
                <ul class="hardware-features" id="hardware-features-list"></ul>
                <!-- CTA inyectado desde content.json -->
                <a href="#" id="hardware-cta" class="btn btn-secondary"></a>
            </div>
        </div>
    </section>

    <!-- Calculator Section -->
    <section class="calculator-section">
        <div class="calc-header">
            <!-- Encabezados inyectados desde content.json -->
            <h2 id="calculator-heading"></h2>
            <p id="calculator-subheading"></p>
        </div>

        <div class="calc-container">
            <!-- Controls -->
            <div class="calc-controls">
                <div class="calc-card">
                    <div class="calc-row-header">
                        <!-- Pregunta inyectada desde content.json -->
                        <span class="calc-question" id="calc-question-citas"></span>
                        <span class="calc-value" id="val-citas">100</span>
                    </div>
                    <input type="range" id="slider-citas" min="0" max="300" value="100" step="5">
                    <div class="calc-labels">
                        <span id="calc-label-min-citas"></span>
                        <span id="calc-label-max-citas"></span>
                    </div>
                </div>

                <div class="calc-card">
                    <div class="calc-row-header">
                        <!-- Pregunta inyectada desde content.json -->
                        <span class="calc-question" id="calc-question-minutos"></span>
                        <span class="calc-value" id="val-minutos">3</span>
                    </div>
                    <input type="range" id="slider-minutos" min="1" max="10" value="3" step="1">
                    <div class="calc-labels">
                        <span id="calc-label-min-minutos"></span>
                        <span id="calc-label-max-minutos"></span>
                    </div>
                </div>
            </div>

            <!-- Results -->
            <div class="calc-results">
                <div>
                    <!-- Labels inyectados desde content.json -->
                    <div class="result-label" id="calc-savings-label"></div>
                    <div class="result-main">
                        <span class="result-number" id="res-mensual">20</span>
                        <span class="result-unit" id="calc-savings-unit"></span>
                    </div>

                    <div class="result-info">
                        <div class="info-icon">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <circle cx="12" cy="12" r="10"></circle>
                                <polyline points="12 6 12 12 16 14"></polyline>
                            </svg>
                        </div>
                        <!-- Texto inyectado desde content.json -->
                        <p id="calc-info-text"></p>
                    </div>
                </div>

                <div class="result-stats">
                    <div class="stat-card">
                        <!-- Labels inyectados desde content.json -->
                        <div class="stat-label" id="calc-annual-label"></div>
                        <div class="stat-value" id="res-anual">240 Horas</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-label" id="calc-efficiency-label"></div>
                        <div class="stat-value" id="calc-efficiency-value"></div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- Roadmap Section -->
    <section class="roadmap">
        <div class="roadmap-header">
            <!-- Encabezados inyectados desde content.json -->
            <div class="roadmap-tag" id="roadmap-tag"></div>
            <h2 id="roadmap-heading"></h2>
            <p id="roadmap-subheading"></p>
        </div>
        <!-- Tarjetas y cohete inyectados dinámicamente desde content.json -->
        <div class="roadmap-grid" id="roadmap-grid"></div>
    </section>

    <!-- CTA Section -->
    <section class="cta-section" id="cta">
        <div class="cta-container">
            <!-- Contenido inyectado desde content.json -->
            <h2 id="cta-heading"></h2>
            <p id="cta-description"></p>
            <a href="#" id="cta-button" class="btn-cta"></a>
        </div>
    </section>

    <!-- Footer Section -->
    <footer class="footer">
        <div class="footer-container">
            <div class="footer-left">
                <img src="Images/Logos/LogoTextoAlia-SinFondo.png" alt="ALIA Logo" class="footer-logo">
                <!-- Copyright inyectado desde content.json -->
                <p id="footer-copyright"></p>
            </div>

            <div class="footer-social">
                <button class="social-btn" aria-label="Compartir">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round">
                        <circle cx="18" cy="5" r="3"></circle>
                        <circle cx="6" cy="12" r="3"></circle>
                        <circle cx="18" cy="19" r="3"></circle>
                        <line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line>
                        <line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line>
                    </svg>
                </button>
                <button class="social-btn" aria-label="Web">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round">
                        <circle cx="12" cy="12" r="10"></circle>
                        <line x1="2" y1="12" x2="22" y2="12"></line>
                        <path
                            d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z">
                        </path>
                    </svg>
                </button>
            </div>
        </div>
    </footer>

    <!-- App Logic (Modules) -->
    <!-- content-loader.js debe cargarse antes que calculator.js y ai-chat.js -->
    <script src="JS/content-loader.js"></script>
    <script type="module" src="JS/Hero/init.js"></script>
    <script src="JS/calculator.js"></script>
    <script src="JS/ai-chat.js"></script>
</body>

</html>
